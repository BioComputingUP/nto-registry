# Research Assessment Reform Initiatives
#
# Landscaping of key international reform initiatives supporting non-traditional
# research assessment, per Table 1 of:
#   Farrell G, Alloza E, Bouhraoua A, Capella-Gutierrez S, Goble C, Hermjakob H,
#   Makaronidou M, Smith A, Sufi S, Vergoulis T, Zoubiri M, Quaglia F, Tosatto SCE.
#   "Credit, recognition, and reward for non-traditional research outputs in the
#   Life Sciences" (2026).
#
# This file shares the single catalogue-version defined in data/nto_catalogue.yml
# (no separate top-level version here) — see CONTRIBUTING.md for the SemVer policy.
# Before contributing, please read CONTRIBUTING.md.
#
# Entry template (fields must appear in this order):
# - id: unique, lowercase, kebab-case identifier
#   initiative: full name of the reform initiative
#   year: year the initiative was launched/published
#   core-philosophy: the initiative's central guiding principle, in 1-2 sentences
#   relevance-to-ntos: how it specifically supports non-traditional outputs
#   url: the initiative's primary homepage
#   added-in-version: registry version this entry was first added in
#   last-modified-version: registry version this entry was last changed in

- id: dora
  initiative: DORA (San Francisco Declaration on Research Assessment)
  year: 2013
  core-philosophy: >-
    Eliminate the use of journal-based metrics (e.g., Journal Impact Factor) for
    funding, appointment, and promotion decisions.
  relevance-to-ntos: >-
    Shifts the assessment focus from where work is published to the intrinsic
    quality of the research itself, opening the door for assessing diverse outputs
    like software and data on their own merit.
  url: https://sfdora.org
  added-in-version: 1.1.0
  last-modified-version: 1.1.0

- id: leiden-manifesto
  initiative: Leiden Manifesto
  year: 2015
  core-philosophy: >-
    Ten principles to guide the responsible use of bibliometrics and prevent the
    abuse of quantitative indicators.
  relevance-to-ntos: >-
    Emphasizes that quantitative metrics must support (not replace) qualitative
    expert assessment and must respect the specific nature of different research
    fields (e.g., computational biology vs. clinical medicine).
  url: https://leidenmanifesto.org
  added-in-version: 1.1.0
  last-modified-version: 1.1.0

- id: hong-kong-principles
  initiative: Hong Kong Principles
  year: 2020
  core-philosophy: >-
    Fosters research integrity by assessing responsible research practices rather
    than just publication counts.
  relevance-to-ntos: >-
    Explicitly calls for rewarding Open Science practices, including the complete
    reporting of methods and the sharing of reliable data, software, code, and
    protocols (Principle 4).
  url: https://www.hkprinciples.org
  added-in-version: 1.1.0
  last-modified-version: 1.1.0

- id: hidden-ref
  initiative: Hidden REF
  year: 2020
  core-philosophy: >-
    A grassroots competition and campaign designed to celebrate all research
    outputs and the diverse people (technicians, dRTPs, and librarians) who make
    research possible.
  relevance-to-ntos: >-
    Provides a practical framework for recognizing Non-Traditionally Submitted
    Outputs (NTOs), such as code, datasets, and exhibitions which are essential to
    the research ecosystem but ignored by traditional REF metrics.
  url: https://www.hidden-ref.org
  added-in-version: 1.1.0
  last-modified-version: 1.1.0

- id: coara
  initiative: CoARA (Coalition for Advancing Research Assessment)
  year: 2022
  core-philosophy: >-
    A global coalition of organisations committing to systemic reform of research
    assessment based on qualitative judgement.
  relevance-to-ntos: >-
    The agreement includes specific commitments to recognize the "diversity of
    contributions to, and careers in, research," providing a direct policy mandate
    for supporting dRTP roles and their outputs.
  url: https://coara.eu
  added-in-version: 1.1.0
  last-modified-version: 1.1.0
