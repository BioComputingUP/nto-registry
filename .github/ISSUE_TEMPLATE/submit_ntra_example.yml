name: Submit a New NTRA Example/Type
description: Propose a new example, a new artefact type, a new supporting infrastructure platform, or a new assessment reform initiative for the NTRA Registry.
title: "[New NTRA]: <Name>"
labels: ["enhancement", "new entry"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for contributing to the NTRA Registry!

        Before you submit, please read [CONTRIBUTING.md](../../CONTRIBUTING.md)
        and [ARTEFACT_TAXONOMY.md](../../ARTEFACT_TAXONOMY.md) to check your
        submission fits the scope, and to see whether "new example" or "new
        artefact type" is the right choice below.

  - type: dropdown
    id: submission_type
    attributes:
      label: Submission Type
      description: What kind of addition is this?
      options:
        - New example for an existing artefact type
        - New artefact type
        - New supporting infrastructure platform
        - New assessment reform initiative
    validations:
      required: true

  - type: input
    id: category
    attributes:
      label: Category
      description: "One of: Data, Training, Software, Research support, Peer review. Leave blank if proposing new infrastructure or a reform initiative not tied to one category."
    validations:
      required: false

  - type: input
    id: artefact
    attributes:
      label: Artefact Type
      description: The existing artefact type this belongs to (e.g. "Curated Knowledgebase Entry"), or your proposed name if this is a new artefact type. Leave blank for infrastructure/reform-initiative submissions. See ARTEFACT_TAXONOMY.md for the current list.
    validations:
      required: false

  - type: input
    id: name
    attributes:
      label: Name
      description: The full, human-readable name of the example, platform, or reform initiative (e.g. "DORA (San Francisco Declaration on Research Assessment)").
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: URL
      description: The primary, stable homepage. Leave blank if none exists yet — do not guess.
    validations:
      required: false

  - type: input
    id: year
    attributes:
      label: Year (reform initiatives only)
      description: The year the initiative was launched/published.
    validations:
      required: false

  - type: textarea
    id: explanation
    attributes:
      label: Explanation / Justification
      description: For a new artefact type, explain what it is and how it differs from existing types. For a new example, briefly explain why it fits. For new infrastructure, explain what credit-capture function it performs. For a reform initiative, describe its core philosophy and relevance to non-traditional research artefacts.
    validations:
      required: true

  - type: textarea
    id: activities
    attributes:
      label: Corresponding Activities (new artefact types only)
      description: One or more activities that produce this artefact.
    validations:
      required: false

  - type: input
    id: infrastructure
    attributes:
      label: Supporting Infrastructure (optional)
      description: Any platform(s) that could capture credit for this (e.g. APICURON, ORCID, bio.tools). Leave blank if unsure.
    validations:
      required: false
